name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:build
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sem-golpe-static-${{ github.sha }}
          path: release/
          retention-days: 14

